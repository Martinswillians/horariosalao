<style>

body{background:var(--bg);color:var(--tx);min-height:100vh}

label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font-size:1rem;background:#fff}
.btn{background:var(--c);color:#fff;border:0;border-radius:24px;padding:12px 22px;font-size:1rem;cursor:pointer;width:100%;margin-top:16px}

.hero .lg{height:64px;margin-bottom:10px}
.cta{display:inline-block;background:var(--c);color:#fff;text-decoration:none;padding:12px 30px;border-radius:25px;border:2px solid rgba(255,255,255,.75)}
.hd{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 5%;box-shadow:0 2px 5px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.hd b{color:var(--c);font-size:1.25rem}.hd img{height:42px}.hd nav{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center}.hd a{margin-left:16px;font-size:.92rem;text-decoration:none;color:#555;font-weight:500}
.sec{max-width:1000px;margin:0 auto;padding:0 16px}
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.sv .card{margin:0;text-align:center}.sv h3{margin-bottom:6px}.pr{font-weight:700;color:var(--c);margin-top:10px}
.pfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.pfs button{border:2px solid var(--bd);background:#fff;border-radius:12px;padding:10px 4px;cursor:pointer;font-size:.85rem}.pfs .on{border-color:var(--c);background:#f3f4f6}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;background:var(--c);color:#fff;font-weight:700;font-size:1.5rem;line-height:64px;text-align:center}
footer{text-align:center;padding:22px;background:#222;color:#fff;margin-top:40px;font-size:.9rem}
textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font:inherit}
.app{display:flex;flex-direction:row-reverse;min-height:100vh}.main{flex:1;min-width:0}.pg{padding:16px;max-width:1100px;margin:0 auto}
.ban{color:#fff;padding:20px 18px;display:flex;align-items:center;gap:12px}.ban h1{font-size:1.3rem}.ban p{opacity:.85;font-size:.9rem}
.burger{display:none;order:-1;background:rgba(255,255,255,.18);border:0;color:#fff;font-size:1.4rem;border-radius:8px;padding:6px 12px;cursor:pointer}
.side{width:250px;background:#111827;color:#e5e7eb;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;text-align:left}
.sb{font-weight:700;font-size:1.05rem;padding:8px 12px 14px;border-bottom:1px solid #374151;margin-bottom:8px}.side nav{flex:1}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.93rem;text-align:left;text-decoration:none;font-family:inherit}

.sf{border-top:1px solid #374151;padding-top:8px;margin-top:8px}.ov{display:none}
@media(max-width:860px){.burger{display:block}.side{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%);transition:transform .25s;z-index:20}.side.open{transform:none}.side.open+.ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}.cal .d{min-height:52px}}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kp>div{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.kp b{display:block;font-size:1.35rem;margin-top:2px}.kp span{color:var(--mu);font-size:.8rem}

.bars{display:flex;align-items:flex-end;gap:4px;height:100px}.bars i{flex:1;background:var(--c);border-radius:4px 4px 0 0}.bl{display:flex;gap:4px;margin-top:4px}.bl span{flex:1;text-align:center;font-size:.65rem;color:var(--mu)}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.72rem;font-weight:600}.tg-n{background:#dbeafe;color:#1e40af}.tg-f{background:#dcfce7;color:#166534}.tg-i{background:#fee2e2;color:#991b1b}.tg-r{background:#f3f4f6;color:#374151}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;font-weight:600;font-size:.8rem;color:var(--mu)}.cal .d{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:.82rem;cursor:pointer;background:#fff}.cal .d.hj{background:#f3f4f6}.cal .d.on{outline:2px solid var(--c)}
.badge{background:var(--c);color:#fff;border-radius:10px;padding:1px 7px;font-size:.72rem}
.tl{display:grid;gap:3px;min-width:100%}.tl .t{font-size:.72rem;color:var(--mu);padding-top:4px}.tl .e{border:1px dashed var(--bd);border-radius:6px;background:#fff;cursor:pointer;color:#bbb}.tl .e:hover{background:#f3f4f6;color:var(--c)}
.tl .ap{border-radius:8px;padding:4px 7px;font-size:.76rem;color:#fff;cursor:pointer;overflow:hidden;background:#2563eb}.ap.ok{background:#16a34a}.ap.no{background:#dc2626}.ap.ps{background:#6b7280}.tl .lun{background:#eee;border-radius:6px;font-size:.7rem;color:#888;text-align:center;padding-top:8px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;overflow:auto;padding:20px;display:flex}.md{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:560px;margin:auto}
.acn{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.cpv{height:70px;border-radius:10px;cursor:pointer;border:3px solid transparent;position:relative;overflow:hidden}.cpv.on{border-color:var(--c)}.cpv span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:3px 6px}
.cal2{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal2 .h{text-align:center;font-weight:600;font-size:.8rem;color:var(--mu)}
.cd{border:1px solid var(--bd);background:#f3f4f6;color:#bbb;border-radius:8px;padding:10px 0;font-size:.9rem}.cd.ok{background:#fff;color:var(--tx);cursor:pointer;font-weight:700;border-color:var(--c)}.cd.on{background:var(--c);color:#fff}
.stp{display:flex;gap:6px;margin-bottom:12px}.stp button{flex:1;display:flex;align-items:center;gap:6px;justify-content:center;border:0;background:#f3f4f6;color:#9ca3af;border-radius:10px;padding:8px 4px;font-size:.8rem;font-family:inherit}
.stp i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#d1d5db;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.stp .cur{background:var(--c);color:#fff}.stp .cur i{background:#fff;color:var(--c)}.stp .done{background:#dcfce7;color:#166534;cursor:pointer}.stp .done i{background:#16a34a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chips span{background:#f3f4f6;border-radius:16px;padding:4px 10px;font-size:.8rem}
.foot{display:flex;gap:10px;position:sticky;bottom:0;background:#fff;padding:12px 0 2px;margin-top:14px}.foot .btn{margin-top:0;flex:1}
.quick{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff7ed;border:1px dashed #f59e0b;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.88rem}
.cnav{display:flex;gap:6px;margin:10px 0 8px}.cnav select{flex:1;padding:8px}.cnav .btn{width:auto;padding:6px 14px}
.cd.hj{outline:2px solid #f59e0b}#slh,#pfx{scroll-margin-top:80px}.slots{grid-template-columns:repeat(2,1fr)}
</style>

<body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,query,where,writeBatch,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyCiuo1YI9kfo7gm3ilovXDlN0gYQxq8Hns",
  authDomain:"horariosalao-ce269.firebaseapp.com",
  projectId:"horariosalao-ce269",
  storageBucket:"horariosalao-ce269.firebasestorage.app",
  messagingSenderId:"882513001742",
  appId:"1:882513001742:web:4e3ec0bd438ef929186b5f"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const A=document.getElementById('app'),$=s=>document.querySelector(s),v=id=>$('#'+id).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const rid=()=>Math.random().toString(36).slice(2,9);
const slugify=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const tm=h=>{const [a,b]=h.split(':');return a*60+ +b},hm=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const wa=(t,msg='')=>{const n=t.replace(/\D/g,'');return 'https://api.whatsapp.com/send?phone='+(n.length<=11?'55':'')+n+(msg?'&text='+encodeURIComponent(msg):'')};
const price=(s,P)=>{const pct=(P||[]).filter(p=>p.ativo!==false&&(!p.servId||p.servId===s.id)).reduce((m,p)=>Math.max(m,+p.pct),0);return{pct,final:s.preco*(1-pct/100)}};
const theme=c=>document.documentElement.style.setProperty('--c',c||'#1f2a37');
const acts={};
const DEF='https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1200&q=80';
const CAPAS={
 b1:{g:'b',n:'Barber clássico',css:'repeating-linear-gradient(115deg,#7f1d1d 0 22px,#f1f5f9 22px 44px,#1e3a8a 44px 66px,#f1f5f9 66px 88px)'},
 b2:{g:'b',n:'Couro e madeira',css:'linear-gradient(135deg,#3b2417,#7c4a2d 50%,#2a170e)'},
 b3:{g:'b',n:'Preto e dourado',css:'radial-gradient(circle at 80% 20%,rgba(184,134,11,.55),transparent 45%),linear-gradient(135deg,#0b0b0b,#2a2a2a)'},
 b4:{g:'b',n:'Azul-marinho',css:'repeating-linear-gradient(45deg,#0f2742 0 14px,#12304f 14px 28px)'},
 s1:{g:'s',n:'Rosé',css:'linear-gradient(135deg,#f4c7d0,#d98ca0 55%,#a85a74)'},
 s2:{g:'s',n:'Lavanda',css:'linear-gradient(135deg,#c9b8f0,#8e7cc3 55%,#5b4b8a)'},
 s3:{g:'s',n:'Champagne',css:'radial-gradient(circle at 20% 30%,#fff3d6,transparent 50%),linear-gradient(135deg,#d9b77e,#a8864f)'},
 s4:{g:'s',n:'Verde sálvia',css:'linear-gradient(135deg,#bcd3c0,#7da287 55%,#4b6e58)'}};
const cover=(u,k)=>`linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),${u?`url('${u}') center/cover`:CAPAS[k]?CAPAS[k].css:`url('${DEF}') center/cover`}`;
const avc=(foto,nome,sz)=>foto?`<img class=av src="${foto}" alt="" style="width:${sz}px;height:${sz}px;margin:0;flex-shrink:0">`:`<div class=av style="width:${sz}px;height:${sz}px;line-height:${sz}px;font-size:${Math.round(sz/2.2)}px;margin:0;flex-shrink:0">${esc((nome||'?')[0])}</div>`;
const av=p=>p.foto?`<img class=av src="${p.foto}" alt="">`:`<div class=av>${esc((p.nome||'?')[0])}</div>`;
const img=(f,max,q,type='image/jpeg')=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(type,q))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
const PAL=['#1f2a37','#0f3d3e','#7c2d12','#1e3a8a','#3f3f46','#6b21a8','#9d174d','#b45309'];
document.addEventListener('change',async e=>{const t=e.target,u=t.dataset.up;
  if(t.id=='cm'||t.id=='cy'){let y=+$('#cy').value,m=+$('#cm').value;const n=new Date();if(y==n.getFullYear()&&m<n.getMonth())m=n.getMonth();CALC={y,m};drawStep2();return}
  if(t.id=='lpf'){LPF=t.value;draw();return}
  if(t.classList.contains('pcustom')){$('#pf'+t.dataset.i).style.display=t.checked?'block':'none';return}
  if(t.id=='pm2'){PM=t.value||PM;draw();return}
  if(t.id=='mn'){const c=clientes().find(x=>x.nome==t.value);if(c)$('#mt').value=c.tel}
  if(t.id=='mp'){nvServ();nvSlots()}
  if(t.id=='ms'){const sv=S.servicos.find(x=>x.id==t.value);$('#mv').value=sv?fmtM(price(sv,S.promocoes).final):'';nvSlots()}
  if(t.id=='md'){NV.pre='';nvSlots()}
  if(!u||!t.files[0])return;
  try{
    if(u=='cfoto'||u=='mefoto'){const d=await img(t.files[0],160,.8);TMP[u]=d;const w=$(u=='cfoto'?'#cfpw':'#mfpw');if(w)w.innerHTML=avc(d,'?',64);return}
    if(u=='comp'){let d=await img(t.files[0],1000,.65);if(d.length>380000)d=await img(t.files[0],800,.5);if(d.length>380000)throw 0;
      await setDoc(doc(db,'saloes',ouid,'agendamentos',t.dataset.id),{comp:d,pstatus:'aguardando'},{merge:true});
      const up=t.closest('.up');if(up)up.innerHTML='✅ Comprovante enviado! O salão vai conferir o pagamento.<br><img src="'+d+'" style="max-width:180px;margin-top:8px;border-radius:8px;border:1px solid #ddd">';toast('Comprovante enviado ✔');if(step=='M')loadMeus();return}
    if(u=='foto'){TMP.foto=await img(t.files[0],160,.8);const f=$('#fp');f.src=TMP.foto;f.style.display='block'}
    else{
      if($('#p1')){S.nome=v('p1');S.whats=v('p2');S.end=v('p3');S.titulo=v('p5');S.sub=v('p6')}
      if(u=='logo')S.logo=await img(t.files[0],240,0,'image/png');
      if(u=='capa'){let d=await img(t.files[0],1400,.72);if(d.length>650000)d=await img(t.files[0],1000,.55);S.capa=d}
      await save();toast('Imagem salva ✔');draw();
    }
  }catch(x){alert('Não foi possível usar essa imagem.')}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&acts[b.dataset.a])acts[b.dataset.a](b)});
let BUSY=new Set(),BUSYKEY='',LS=null,CALC={y:new Date().getFullYear(),m:new Date().getMonth()},CU=null,CP=null,CM='login',MY=[],U=null,S=null,TAB='dash',AG=[],busy=false,EDIT=null,TMP={};
const E=l=>EDIT&&EDIT.l==l?S[l][EDIT.i]:null;
const toast=m=>{const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:24px;z-index:9;font-size:.95rem';document.body.append(d);setTimeout(()=>d.remove(),2200)};

/* ============ ROTEAMENTO ============ */
const slug=new URLSearchParams(location.search).get('s');
if(slug){
  booking(slug);

    if(S&&$('#wiz')){hdr();if(step!='L'&&step!='M')bk()}});
}else onAuthStateChanged(auth,u=>{U=u;if(busy)return;u?panel():landing()});

acts.meperfil=()=>{TMP.mefoto=undefined;openM(`<h2>Meu perfil</h2><div style="text-align:center;margin:10px 0" id=mfpw>${avc(CP&&CP.foto,(CP&&CP.nome)||CU.email,84)}</div><label>Foto</label><input type=file accept="image/*" data-up=mefoto><label>Nome</label><input id=pn value="${esc(CP&&CP.nome)}"><label>WhatsApp</label><input id=pt type=tel value="${esc(CP&&CP.tel)}"><button class=btn data-a=mesave>Salvar</button><button class="btn o" data-a=closem>Fechar</button>`)};

/* ============ LANDING / LOGIN / CADASTRO ============ */
function landing(mode='login'){
  theme();
  A.innerHTML=`<div class="top hero" style="background:${cover()}"><h1>Horário Salão</h1><p>Seu salão com agenda online. Cadastre-se e envie o link aos seus clientes.</p><a class=cta href="#acesso">Cadastrar meu salão</a></div>
  <div class=wrap><div class=card id=acesso><div class=tabs>
  <button class="${mode=='login'?'on':''}" data-a=lg>Entrar</button><button class="${mode=='cad'?'on':''}" data-a=cd>Cadastrar salão</button></div>
  ${mode=='cad'?`<label>Nome do salão</label><input id=nm placeholder="Ex.: Beleza & Estilo">

function cal(){
  const {y,m}=CAL,start=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),hoje=iso(new Date()),cnt={};
  AGALL.forEach(a=>{if(a.status!='faltou')cnt[a.data]=(cnt[a.data]||0)+1});
  let cells=DIAS.map(d=>`<div class=h>${d}</div>`).join('')+'<div></div>'.repeat(start);
  for(let d=1;d<=dim;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="d ${ds==DAYSEL?'on':''} ${ds==hoje?'hj':''}" data-a=pday data-d=${ds}><b>${d}</b>${cnt[ds]?`<br><span class=badge>${cnt[ds]}</span>`:''}</div>`}
  return `<div class=card style="margin-top:0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="btn s o" data-a=cprev>‹</button><b>${MES[m]} ${y}</b><button class="btn s o" data-a=cnext>›</button></div><div class=cal>${cells}</div></div>
  <div class=card id=dayc><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0">${fd(DAYSEL)} · ${DIAS[new Date(DAYSEL+'T12:00').getDay()]}</h2><button class="btn s" data-a=novoday>＋ Agendar neste dia</button></div><p class=mu style="margin:6px 0 10px">Clique em um horário vazio (＋) para agendar, ou em um agendamento para ver os detalhes.</p><div style="overflow:auto">${dayGrid(DAYSEL)}</div></div>`;
}
function dayGrid(d){
  const wd=wdOf(d),P=(S.profissionais.filter(act).length?S.profissionais.filter(act):[{id:'',nome:'Geral'}]),H=P.map(p=>p.id?hrsOf(p.id):S);
  const t0=Math.min(...H.map(h=>tm(h.abre))),t1=Math.max(...H.map(h=>tm(h.fecha))),ps=S.passo||30,rm=ps%30==0?30:15;
  if(!H.some(h=>h.dias.includes(wd)))return '<p class=mu>Ninguém atende neste dia (veja Configurações › Horários).</p>';
  const rows=Math.max(1,Math.ceil((t1-t0)/rm)),ags=AGALL.filter(a=>a.data==d);
  let h=`<div class=tl style="grid-template-columns:52px repeat(${P.length},minmax(120px,1fr));grid-template-rows:auto repeat(${rows},${rm==15?'26px':'38px'})"><div></div>${P.map(p=>`<div style="text-align:center;font-weight:600;font-size:.85rem;padding-bottom:4px">${esc(p.nome)}</div>`).join('')}`;
  for(let r=0;r<rows;r++)h+=`<div class=t style="grid-row:${r+2};grid-column:1">${(r*rm)%30==0||rm==30?hm(t0+r*rm):''}</div>`;
  P.forEach((p,ci)=>{const cov={},x=H[ci];
    ags.filter(a=>a.prof==p.id).forEach(a=>{const r0=Math.round((tm(a.hora)-t0)/rm),n=Math.min(Math.max(1,Math.ceil(durOf(a)/rm)),rows-r0);if(r0<0||r0>=rows)return;
      h+=`<div class="ap ${{ag:'',concluido:'ok',faltou:'no',ps:'ps'}[stOf(a)]}" style="grid-row:${r0+2}/span ${n};grid-column:${ci+2}" data-a=agd data-id=${a.id}><b>${a.hora}</b> ${esc(a.nome)}<br>${esc(a.servico)}</div>`;for(let k=0;k<n;k++)cov[r0+k]=1});
    for(let r=0;r<rows;r++){if(cov[r])continue;const t=t0+r*rm,off=!x.dias.includes(wd)||t<tm(x.abre)||t>=tm(x.fecha),lun=x.almI&&x.almF&&t>=tm(x.almI)&&t<tm(x.almF);
      h+=off?`<div class=lun style="grid-row:${r+2};grid-column:${ci+2};background:#f3f3f3;color:#bbb">${!x.dias.includes(wd)&&r==0?'folga':''}</div>`:lun?`<div class=lun style="grid-row:${r+2};grid-column:${ci+2}">almoço</div>`:(t-tm(x.abre))%ps==0?`<button class=e style="grid-row:${r+2};grid-column:${ci+2}" data-a=slotnew data-p="${p.id}" data-h="${hm(t)}">＋</button>`:`<div style="grid-row:${r+2};grid-column:${ci+2}"></div>`}});
  return h+'</div>';
}

function lrange(){const d=new Date(LR+'T12:00'),y=d.getFullYear(),m=d.getMonth(),p=n=>String(n).padStart(2,'0'),f=(yy,mm,dd)=>`${yy}-${p(mm+1)}-${p(dd)}`,last=new Date(y,m+1,0).getDate();

    m.ult=ps.length?ps[ps.length-1].data:'';m.prox=m.ag.find(a=>a.data>=hoje&&!a.status);m.desde=m.ag[0].data;
    const ds=ps.map(a=>new Date(a.data+'T12:00').getTime()),g=[];for(let i=1;i<ds.length;i++)g.push((ds[i]-ds[i-1])/864e5);m.freq=g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length):0;
    const mode=f=>{const c={};ok.forEach(a=>c[f(a)]=(c[f(a)]||0)+1);const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:'—'};
    m.fs=mode(a=>a.servico);m.fp=mode(a=>a.profNome);m.dias=m.ult?Math.round((Date.now()-new Date(m.ult+'T12:00'))/864e5):0;
    m.tag=m.n==1?['Novo','n']:(m.ult&&m.dias>45&&!m.prox)?['Inativo','i']:ok.length>=5?['Fiel','f']:['Regular','r'];

}

function brcode(valor,txid){
  const gui=tlv('00','br.gov.bcb.pix')+tlv('01',pixKey());
  let p=tlv('00','01')+tlv('01','11')+tlv('26',gui)+tlv('52','0000')+tlv('53','986')+(valor>0?tlv('54',(+valor).toFixed(2)):'')+tlv('58','BR')+tlv('59',asc(S.pixNome||S.nome,25))+tlv('60',asc(S.pixCidade||'Brasilia',15))+tlv('62',tlv('05',String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'));

const busyAdd=(set,o)=>{const n=(o.m||30)/15;for(let k=0;k<n;k++)set.add(o.prof+'_'+o.data+'_'+hm(tm(o.hora)+k*15))};

function slotsFor(prof,sv,d,busy){
  const H=hrsOf(prof);if(!H.dias.includes(wdOf(d)))return[];
  const st=S.passo||30,u=Math.ceil(sv.min/15),now=new Date(),hoje=d==iso(now),out=[];
  for(let t=tm(H.abre);t+sv.min<=tm(H.fecha);t+=st){
    if(hoje&&t<=now.getHours()*60+now.getMinutes())continue;
    let ok=true;for(let k=0;k<u;k++){const b=t+k*15;if(busy.has(prof+'_'+d+'_'+hm(b))||(H.almI&&H.almF&&b>=tm(H.almI)&&b<tm(H.almF)))ok=false}
    if(ok)out.push(hm(t));
  }

}

  ${S.promocoes.filter(act).length?`<div class=sec>${S.promocoes.filter(act).map(p=>`<div class=promo>🎉 <b>${esc(p.titulo)}</b> — ${p.pct}% de desconto</div>`).join('')}</div>`:''}
  <div class=sec id=servicos><h2 style="text-align:center;margin:30px 0 16px">Nossos serviços</h2><div class=sv>${cards}</div></div>
  <div class=wrap id=agendamento><h2 style="text-align:center;margin:30px 0 0">Faça seu agendamento</h2><div class=card id=wiz></div></div>
  <footer>© ${new Date().getFullYear()} ${esc(S.nome)}${S.end?' · '+esc(S.end):''}</footer>`;
  hdr();bk();
}
const bsv=()=>S.servicos.find(s=>s.id==B.serv),bpf=()=>S.profissionais.find(p=>p.id==B.prof);
function bk(){
  const bar=stepper(step);
  let c='';
  if(step=='L'){
    const cad=CM=='cad';
    c=`<h2>${cad?'Criar conta':'Entrar'}</h2><p class=mu>Com uma conta você acompanha e cancela seus agendamentos.</p>${cad?'<label>Nome completo</label><input id=ln autocomplete=name><label>WhatsApp</label><input id=lt type=tel placeholder="(61) 99999-9999">':''}<label>E-mail</label><input id=le type=email autocomplete=email><label>Senha</label><input id=lp type=password placeholder="mínimo 6 caracteres"><button class=btn data-a=cgo>${cad?'Criar conta':'Entrar'}</button><button class="btn o" data-a=ctog>${cad?'Já tenho conta':'Criar conta'}</button><button class="btn o" data-a=home>Voltar</button>`;
  }
  if(step=='M')c=`<h2>Meus agendamentos</h2><div id=ml><p class=mu>Carregando…</p></div><button class="btn o" data-a=novo>Novo agendamento</button>`;
  if(step==1){
    const md=B.mode=='data',sel=bpf(),tog=`<div class=tabs style="margin-bottom:12px"><button class="${md?'':'on'}" data-a=bmode data-m=prof>Escolher o profissional</button><button class="${md?'on':''}" data-a=bmode data-m=data>Escolher o dia e horário</button></div>`;
    const L=S.servicos.filter(x=>act(x)&&(md||!sel||!(sel.servs&&sel.servs.length)||sel.servs.includes(x.id))),cats=[...new Set(L.map(x=>x.cat||'Serviços'))];
    const opts=cats.map(k=>`<optgroup label="${esc(k)}">${L.filter(x=>(x.cat||'Serviços')==k).map(x=>{const p=price(x,S.promocoes);return`<option value="${x.id}" ${B.serv==x.id?'selected':''}>${esc(x.nome)} — ${brl(p.final)} (${x.min}min)</option>`}).join('')}</optgroup>`).join('');
    c=md?`${bar}${tog}<h2>Escolha o serviço</h2><p class=mu>Depois você escolhe o dia e o horário e vê quais profissionais estão disponíveis.</p><label>Serviço</label><select id=ss><option value="">Selecione</option>${opts}</select><div class=foot><button class=btn data-a=n1>Continuar</button></div>`
    :`${bar}${tog}<h2>Escolha o profissional</h2><div class=pfs>${S.profissionais.filter(act).map(p=>`<button data-a=pickprof data-p=${p.id} class="${B.prof==p.id?'on':''}">${av(p)}<b>${esc(p.nome)}</b><br><span class=mu>${esc(p.funcao||'')}</span><br><span class=mu style="font-size:.7rem">${hrsOf(p.id).dias.map(d=>DIAS[d]).join(' · ')}</span></button>`).join('')||'<p class=mu>Nenhum profissional cadastrado.</p>'}</div>
    <label>Serviço</label><select id=ss ${sel?'':'disabled'}><option value="">${sel?'Selecione':'Escolha o profissional primeiro'}</option>${opts}</select><div class=foot><button class=btn data-a=n1>Continuar</button></div>`;
  }
  if(step==2)c='<p class=mu>Carregando disponibilidade…</p>';
  if(step==3){
    const s=bsv(),p=price(s,S.promocoes);
    c=`${bar}<h2>Seus dados</h2>${sumChips()}
    ${CU?`<p class=mu>Agendando como ${esc(CU.email)}</p>`:'<p class=mu>Já tem conta? <a href="#agendamento" data-a=clogin>Entre</a> para acompanhar seus agendamentos.</p>'}<label>Nome completo</label><input id=cn autocomplete=name value="${esc(CP?.nome)}"><label>WhatsApp</label><input id=ct type=tel placeholder="(61) 99999-9999" autocomplete=tel value="${esc(CP?.tel)}"><label>Forma de pagamento</label><div class=dias><label><input type=radio name=fp value=local checked> Pagar no salão</label>${S.pixOn&&S.pixChave?'<label><input type=radio name=fp value=pix> PIX (QR code)</label>':''}</div>
    <div class=foot><button class="btn o" data-a=back>Voltar</button><button class=btn data-a=conf id=cf>Confirmar agendamento</button></div>`;
  }
  if(step==4){
    c=`<div class=ok><div class=big>✅</div><h2>Agendamento confirmado!</h2><p>${esc(bsv().nome)} com ${esc(bpf().nome)}<br><b>${B.data.split('-').reverse().join('/')} às ${B.hora}</b></p>
    ${B.forma=='pix'?'<div id=pixbox style="margin:14px 0"></div>':'<p class=mu style="margin:8px 0">Pagamento no salão.</p>'}${S.whats?`<a class=btn style="display:block;text-decoration:none" target=_blank href="${wa(S.whats,'Olá! Agendei '+bsv().nome+' em '+B.data.split('-').reverse().join('/')+' às '+B.hora+' (nome: '+B.nome+').')}">Avisar no WhatsApp do salão</a>`:''}${CU?'<button class="btn o" data-a=meus>Ver meus agendamentos</button>':'<p class=mu style="margin-top:14px">Crie uma conta para acompanhar seus agendamentos: <a href="#agendamento" data-a=clogin>Entrar / Criar conta</a></p>'}<button class="btn o" data-a=novo>Novo agendamento</button></div>`;
  }
  $('#wiz').innerHTML=c;if(step==4&&B.forma=='pix')showPix($('#pixbox'),B.valor,B.agId,true);if(step!=1&&step!==LS)$('#wiz').scrollIntoView();LS=step;if(step=='M')loadMeus();
  if(step==2)drawStep2();
}
acts.back=()=>{step--;bk()};
acts.clogin=()=>{CM='login';step='L';bk()};
acts.ctog=()=>{CM=CM=='cad'?'login':'cad';bk()};
acts.meus=()=>{step='M';bk()};
acts.home=()=>{step=(B.hora&&B.serv&&!B.done)?3:1;bk()};
acts.novo=()=>{B={};step=1;bk()};
acts.csair=async()=>{await signOut(auth);CU=CP=null;hdr();if(step=='M')step=1;bk()};
acts.cgo=async()=>{
  const em=v('le'),pw=v('lp');if(!em||pw.length<6)return alert('Informe e-mail e senha (mínimo 6 caracteres).');
  busy=true;
  try{
    if(CM=='cad'){const nome=v('ln'),tel=v('lt');if(nome.length<3||tel.replace(/\D/g,'').length<10)throw{message:'Informe nome e WhatsApp com DDD.'};
      CU=(await createUserWithEmailAndPassword(auth,em,pw)).user;CP={nome,tel,email:em};await setDoc(doc(db,'clientes',CU.uid),CP)}
    else{CU=(await signInWithEmailAndPassword(auth,em,pw)).user;CP=null;try{CP=(await getDoc(doc(db,'clientes',CU.uid))).data()||null}catch(e){}}
  }catch(e){busy=false;alert(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(e.code)?'E-mail ou senha inválidos.':e.code=='auth/email-already-in-use'?'Este e-mail já tem conta. Use Entrar.':(e.message||'Erro ao entrar.'));return}
  busy=false;hdr();step=(B.hora&&B.serv&&!B.done)?3:1;bk();
};
async function loadMeus(){
  try{
    const q=await getDocs(query(collection(db,'saloes',ouid,'agendamentos'),where('cuid','==',CU.uid)));
    MY=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
    const hoje=iso(new Date());
    $('#ml').innerHTML=MY.length?MY.map((a,i)=>{const f=a.data>=hoje;return`<div class=row><span><b>${a.data.split('-').reverse().join('/')} ${a.hora}</b> · ${esc(a.servico)} com ${esc(a.profNome)}<br><span class=mu>${brl(a.valor)} · ${a.status=='concluido'?'Concluído':a.status=='faltou'?'Faltou':f?'Agendado':'Realizado'}</span><br>${ptag(a)}${a.comp?`<br><button class="btn s o" style="margin-top:6px" data-a=vcomp data-i=${i}>Ver comprovante</button>`:''}${a.forma=='pix'&&pOf(a)!='pago'&&S.pixChave?`<br><button class="btn s" style="margin-top:6px" data-a=cpay data-i=${i}>Pagar com PIX / enviar comprovante</button>`:''}</span>${f?`<button class=x data-a=ccancel data-i=${i} title="Cancelar">✕</button>`:''}</div>`}).join(''):'<p class=mu>Você ainda não tem agendamentos neste salão.</p>';
  }catch(e){$('#ml').innerHTML='<p class=mu>Não foi possível carregar seus agendamentos.</p>'}
}
acts.ccancel=async b=>{const a=MY[+b.dataset.i];if(!confirm('Cancelar este agendamento?'))return;const w=writeBatch(db);(a.blocos||[]).forEach(id=>w.delete(doc(db,'ocupados',id)));w.delete(doc(db,'saloes',ouid,'agendamentos',a.id));try{await w.commit();toast('Agendamento cancelado');loadMeus()}catch(e){alert('Não foi possível cancelar.')}};
acts.pickprof=b=>{const x=$('#ss');if(x)B.serv=x.value;B.prof=b.dataset.p;const pf=bpf();if(pf.servs&&pf.servs.length&&!pf.servs.includes(B.serv))B.serv='';bk()};
acts.bmode=b=>{const x=$('#ss');if(x)B.serv=x.value;B.mode=b.dataset.m;B.prof=B.mode=='data'?'':B.prof;bk()};
acts.n1=()=>{B.serv=$('#ss').value;const md=B.mode=='data';if(!B.serv||(!md&&!B.prof))return alert(md?'Escolha o serviço.':'Escolha o profissional e o serviço.');if(md)B.prof='';BUSYKEY='';B.data='';B.hora='';CALC={y:new Date().getFullYear(),m:new Date().getMonth()};step=2;bk()};
acts.n2=()=>{step=3;bk()};
acts.cday=b=>{B.data=b.dataset.d;B.hora='';if(B.mode=='data')B.prof='';SCR='slh';drawStep2()};
acts.pick=b=>{B.hora=b.dataset.h;if(B.mode=='data'){B.prof='';SCR='pfx'}drawStep2()};
acts.pickp2=b=>{B.prof=b.dataset.p;drawStep2()};
acts.cnavm=b=>{let {y,m}=CALC;m+=+b.dataset.n;if(m<0){m=11;y--}if(m>11){m=0;y++}const n=new Date();if(y<n.getFullYear()||(y==n.getFullYear()&&m<n.getMonth()))return;CALC={y,m};drawStep2()};
function nextFree(sv,md){const t=new Date();for(let i=0;i<120;i++){const d=iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i));let best=null;
  (md?elig(sv):[bpf()]).forEach(p=>{const L=slotsFor(p.id,sv,d,BUSY);if(L.length&&(!best||L[0]<best.h))best={d,h:L[0],p:p.id}});if(best)return best}return null}
async function drawStep2(){
  const sv=bsv(),md=B.mode=='data',pf=bpf(),wiz=$('#wiz');
  wiz.innerHTML='<p class=mu>Carregando disponibilidade…</p>';
  try{await loadBusy(md?'':B.prof)}catch(e){wiz.innerHTML='<p class=mu>Não foi possível carregar a disponibilidade. Tente de novo.</p><div class=foot><button class="btn o" data-a=back>Voltar</button></div>';return}
  const {y,m}=CALC,now=new Date(),hoje=iso(now),start=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const okDay=d=>md?elig(sv).some(p=>slotsFor(p.id,sv,d,BUSY).length>0):slotsFor(B.prof,sv,d,BUSY).length>0;
  let cells=DIAS.map(d=>`<div class=h>${d}</div>`).join('')+'<div></div>'.repeat(start);
  for(let d=1;d<=dim;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ok=ds>=hoje&&okDay(ds);cells+=ok?`<button class="cd ok ${ds==B.data?'on':''} ${ds==hoje?'hj':''}" data-a=cday data-d=${ds}>${d}</button>`:`<button class="cd ${ds==hoje?'hj':''}" disabled>${d}</button>`}
  const none='<p class=mu style="grid-column:1/-1">Sem horários livres neste dia.</p>',btn=h=>`<button data-a=pick data-h=${h} class="${h==B.hora?'on':''}">${rng(h,sv)}</button>`;let sl='',pfx='',done=false;
  if(B.data){
    if(!md){const L=slotsFor(B.prof,sv,B.data,BUSY);sl=L.length?L.map(btn).join(''):none;done=!!B.hora}
    else{const mp={};elig(sv).forEach(p=>slotsFor(p.id,sv,B.data,BUSY).forEach(t=>(mp[t]=mp[t]||[]).push(p)));const ts=Object.keys(mp).sort();
      sl=ts.length?ts.map(btn).join(''):none;
      if(B.hora&&mp[B.hora]){const c2=mp[B.hora];if(c2.length==1)B.prof=c2[0].id;
        pfx=`<h3 id=pfx style="margin:16px 0 6px">Profissionais disponíveis às ${B.hora}</h3><div class=pfs>${c2.map(p=>`<button data-a=pickp2 data-p=${p.id} class="${B.prof==p.id?'on':''}">${av(p)}<b>${esc(p.nome)}</b><br><span class=mu>${esc(p.funcao||'')}</span></button>`).join('')}</div>`;done=!!B.prof&&c2.some(p=>p.id==B.prof)}}
  }
  const q=nextFree(sv,md),yrs=[now.getFullYear(),now.getFullYear()+1,now.getFullYear()+2];
  wiz.innerHTML=`${stepper(2)}${sumChips()}<h2>${md?'Escolha o dia e o horário':'Dia e horário de '+esc(pf.nome)}</h2>${!md&&pf?`<p class=mu style="margin:0 0 8px">${esc(pf.nome)} atende: ${resumo(hrsOf(pf.id))}</p>`:''}
  ${q?`<div class=quick><span>⚡ Próximo horário livre: <b>${fd(q.d)} · ${DIAS[wdOf(q.d)]} às ${q.h}</b></span><button class="btn s" data-a=quick data-d=${q.d} data-h=${q.h} data-p=${q.p}>Escolher</button></div>`:'<p class=mu>Sem horários livres nos próximos meses.</p>'}
  <div class=cnav><select id=cm>${MES.map((n,i)=>`<option value=${i} ${i==m?'selected':''} ${y==now.getFullYear()&&i<now.getMonth()?'disabled':''}>${n}</option>`).join('')}</select><select id=cy>${yrs.map(v=>`<option ${v==y?'selected':''}>${v}</option>`).join('')}</select><button class="btn s o" data-a=cnavm data-n=-1>‹</button><button class="btn s o" data-a=cnavm data-n=1>›</button></div>
  <div class=cal2>${cells}</div><p class=mu style="margin:6px 0">Dias em destaque têm horários livres.</p>
  ${B.data?`<h3 id=slh style="margin:12px 0 6px">${fd(B.data)} · ${DIAS[wdOf(B.data)]} — escolha o horário</h3><div class=slots>${sl}</div>`:''}${pfx}
  <div class=foot><button class="btn o" data-a=back>Voltar</button><button class=btn data-a=n2 ${done?'':'disabled'}>Continuar</button></div>`;
  if(SCR){const e=$('#'+SCR);SCR='';if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
}
acts.gostep=b=>{const n=+b.dataset.s;if(n<step){step=n;bk()}};
acts.quick=b=>{B.data=b.dataset.d;B.hora=b.dataset.h;if(B.mode=='data'){B.prof='';SCR='pfx'}CALC={y:+B.data.slice(0,4),m:+B.data.slice(5,7)-1};drawStep2()};
acts.conf=async()=>{
  const nome=v('cn'),tel=v('ct');if(nome.length<3||tel.replace(/\D/g,'').length<10)return alert('Informe seu nome e WhatsApp com DDD.');
  $('#cf').disabled=true;const sv=bsv(),p=price(sv,S.promocoes);
  const forma=(document.querySelector('input[name=fp]:checked')||{}).value||'local';
  try{B.agId=await commitAg(ouid,bpf(),sv,B.data,B.hora,nome,tel,CU?CU.uid:'',p.final,CU?CU.email:'','cliente',forma,(CP&&CP.foto)||'');B.forma=forma;B.valor=p.final;B.nome=nome;B.done=true;step=4;bk()}
  catch(e){alert('Esse horário acabou de ser ocupado. Escolha outro.');BUSYKEY='';B.hora='';step=2;bk()}
};
</script>
</body>
