<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2a37">
<title>Horário Salão | Agendamento Online</title>
<style>
:root{--c:#1f2a37;--bg:#f3f4f6;--tx:#222;--mu:#777;--bd:#e2e2e2}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.top{background:var(--c);color:#fff;padding:22px 16px;text-align:center}
.top h1{font-size:1.5rem}.top p{opacity:.9;font-size:.9rem;margin-top:4px}
.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{font-size:1.1rem;margin-bottom:12px}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font-size:1rem;background:#fff}
.btn{background:var(--c);color:#fff;border:0;border-radius:24px;padding:12px 22px;font-size:1rem;cursor:pointer;width:100%;margin-top:16px}
.btn.s{width:auto;padding:8px 14px;font-size:.85rem;margin:0}
.btn.o{background:#fff;color:var(--c);border:1px solid var(--c)}
.btn:disabled{opacity:.4}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs button{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:8px 14px;white-space:nowrap;cursor:pointer}
.tabs .on{background:var(--c);color:#fff;border-color:var(--c)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:.92rem}
.x{border:0;background:none;color:#c33;font-size:1.1rem;cursor:pointer}
.add{display:grid;gap:8px;margin-top:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slots button{padding:10px;border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:pointer}
.slots .on{background:var(--c);color:#fff;border-color:var(--c)}
.promo{background:#fff4e5;border:1px dashed #f0a030;border-radius:10px;padding:10px;margin:8px 0;font-size:.9rem}
.mu{color:var(--mu);font-size:.85rem}
.old{text-decoration:line-through;color:var(--mu);margin-right:6px}
.dias{display:flex;flex-wrap:wrap;gap:10px}.dias label{display:flex;gap:4px;align-items:center;margin:0;font-weight:400}.dias input{width:auto}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps i{flex:1;height:4px;background:var(--bd);border-radius:2px}.steps i.on{background:var(--c)}
.ok{text-align:center}.ok .big{font-size:3rem}
html{scroll-behavior:smooth}#wiz,#servicos,#agendamento{scroll-margin-top:70px}
.hero{padding:70px 16px;color:#fff;text-align:center}.hero h1{font-size:2rem}.hero p{font-size:1.05rem;margin:8px 0 18px}
.hero .lg{height:64px;margin-bottom:10px}
.cta{display:inline-block;background:var(--c);color:#fff;text-decoration:none;padding:12px 30px;border-radius:25px;border:2px solid rgba(255,255,255,.75)}
.hd{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 5%;box-shadow:0 2px 5px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.hd b{color:var(--c);font-size:1.25rem}.hd img{height:42px}.hd nav{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center}.hd a{margin-left:16px;font-size:.92rem;text-decoration:none;color:#555;font-weight:500}
.sec{max-width:1000px;margin:0 auto;padding:0 16px}
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.sv .card{margin:0;text-align:center}.sv h3{margin-bottom:6px}.pr{font-weight:700;color:var(--c);margin-top:10px}
.pfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.pfs button{border:2px solid var(--bd);background:#fff;border-radius:12px;padding:10px 4px;cursor:pointer;font-size:.85rem}.pfs .on{border-color:var(--c);background:#f3f4f6}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;background:var(--c);color:#fff;font-weight:700;font-size:1.5rem;line-height:64px;text-align:center}
footer{text-align:center;padding:22px;background:#222;color:#fff;margin-top:40px;font-size:.9rem}
textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font:inherit}
.app{display:flex;min-height:100vh}.main{flex:1;min-width:0}.pg{padding:16px;max-width:1100px;margin:0 auto}
.ban{color:#fff;padding:20px 18px;display:flex;align-items:center;gap:12px}.ban h1{font-size:1.3rem}.ban p{opacity:.85;font-size:.9rem}
.burger{display:none;margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;font-size:1.4rem;border-radius:8px;padding:6px 12px;cursor:pointer}
.side{width:250px;background:#111827;color:#e5e7eb;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;text-align:right}
.sb{font-weight:700;font-size:1.05rem;padding:8px 12px 14px;border-bottom:1px solid #374151;margin-bottom:8px}.side nav{flex:1}
.nv{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.93rem;text-align:right;text-decoration:none;font-family:inherit}
.nv:hover{background:#1f2937}.nv.on{background:var(--c);color:#fff}.nv.sub{padding-right:30px;font-size:.88rem;color:#cbd5e1;display:block}.nv.sub.on{color:#fff}
.sf{border-top:1px solid #374151;padding-top:8px;margin-top:8px}.ov{display:none}
@media(max-width:860px){.burger{display:block}.side{position:fixed;right:0;top:0;height:100%;transform:translateX(100%);transition:transform .25s;z-index:20}.side.open{transform:none}.side.open+.ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}.cal .d{min-height:52px}}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kp>div{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.kp b{display:block;font-size:1.35rem;margin-top:2px}.kp span{color:var(--mu);font-size:.8rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}.g2 .card{margin:0}
.bars{display:flex;align-items:flex-end;gap:4px;height:100px}.bars i{flex:1;background:var(--c);border-radius:4px 4px 0 0}.bl{display:flex;gap:4px;margin-top:4px}.bl span{flex:1;text-align:center;font-size:.65rem;color:var(--mu)}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.72rem;font-weight:600}.tg-n{background:#dbeafe;color:#1e40af}.tg-f{background:#dcfce7;color:#166534}.tg-i{background:#fee2e2;color:#991b1b}.tg-r{background:#f3f4f6;color:#374151}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;font-weight:600;font-size:.8rem;color:var(--mu)}.cal .d{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:.82rem;cursor:pointer;background:#fff}.cal .d.hj{background:#f3f4f6}.cal .d.on{outline:2px solid var(--c)}
.badge{background:var(--c);color:#fff;border-radius:10px;padding:1px 7px;font-size:.72rem}
.tl{display:grid;gap:3px;min-width:100%}.tl .t{font-size:.72rem;color:var(--mu);padding-top:4px}.tl .e{border:1px dashed var(--bd);border-radius:6px;background:#fff;cursor:pointer;color:#bbb}.tl .e:hover{background:#f3f4f6;color:var(--c)}
.tl .ap{border-radius:8px;padding:4px 7px;font-size:.76rem;color:#fff;cursor:pointer;overflow:hidden;background:#2563eb}.ap.ok{background:#16a34a}.ap.no{background:#dc2626}.ap.ps{background:#6b7280}.tl .lun{background:#eee;border-radius:6px;font-size:.7rem;color:#888;text-align:center;padding-top:8px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;overflow:auto;padding:20px;display:flex}.md{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:560px;margin:auto}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="mu">Carregando…</p></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,query,where,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyCiuo1YI9kfo7gm3ilovXDlN0gYQxq8Hns",
  authDomain:"horariosalao-ce269.firebaseapp.com",
  projectId:"horariosalao-ce269",
  storageBucket:"horariosalao-ce269.firebasestorage.app",
  messagingSenderId:"882513001742",
  appId:"1:882513001742:web:4e3ec0bd438ef929186b5f"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const A=document.getElementById('app'),$=s=>document.querySelector(s),v=id=>$('#'+id).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const rid=()=>Math.random().toString(36).slice(2,9);
const slugify=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const tm=h=>{const [a,b]=h.split(':');return a*60+ +b},hm=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const wa=(t,msg='')=>{const n=t.replace(/\D/g,'');return 'https://api.whatsapp.com/send?phone='+(n.length<=11?'55':'')+n+(msg?'&text='+encodeURIComponent(msg):'')};
const price=(s,P)=>{const pct=(P||[]).filter(p=>!p.servId||p.servId===s.id).reduce((m,p)=>Math.max(m,+p.pct),0);return{pct,final:s.preco*(1-pct/100)}};
const theme=c=>document.documentElement.style.setProperty('--c',c||'#1f2a37');
const acts={};
const DEF='https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1200&q=80';
const cover=u=>`linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('${u||DEF}') center/cover`;
const av=p=>p.foto?`<img class=av src="${p.foto}" alt="">`:`<div class=av>${esc((p.nome||'?')[0])}</div>`;
const img=(f,max,q,type='image/jpeg')=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(type,q))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
const PAL=['#1f2a37','#0f3d3e','#7c2d12','#1e3a8a','#3f3f46','#6b21a8','#9d174d','#b45309'];
document.addEventListener('change',async e=>{const t=e.target,u=t.dataset.up;
  if(t.id=='mn'){const c=clientes().find(x=>x.nome==t.value);if(c)$('#mt').value=c.tel}
  if(t.id=='mp'){nvServ();nvSlots()}
  if(t.id=='ms'){const sv=S.servicos.find(x=>x.id==t.value);$('#mv').value=sv?price(sv,S.promocoes).final.toFixed(2):'';nvSlots()}
  if(t.id=='md'){NV.pre='';nvSlots()}
  if(!u||!t.files[0])return;
  try{
    if(u=='foto'){TMP.foto=await img(t.files[0],160,.8);const f=$('#fp');f.src=TMP.foto;f.style.display='block'}
    else{
      if($('#p1')){S.nome=v('p1');S.whats=v('p2');S.end=v('p3');S.titulo=v('p5');S.sub=v('p6')}
      if(u=='logo')S.logo=await img(t.files[0],240,0,'image/png');
      if(u=='capa'){let d=await img(t.files[0],1400,.72);if(d.length>650000)d=await img(t.files[0],1000,.55);S.capa=d}
      await save();toast('Imagem salva ✔');draw();
    }
  }catch(x){alert('Não foi possível usar essa imagem.')}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&acts[b.dataset.a])acts[b.dataset.a](b)});
let CU=null,CP=null,CM='login',MY=[],U=null,S=null,TAB='dash',AG=[],busy=false,EDIT=null,TMP={};
const E=l=>EDIT&&EDIT.l==l?S[l][EDIT.i]:null;
const toast=m=>{const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:24px;z-index:9;font-size:.95rem';document.body.append(d);setTimeout(()=>d.remove(),2200)};

/* ============ ROTEAMENTO ============ */
const slug=new URLSearchParams(location.search).get('s');
if(slug){
  booking(slug);
  onAuthStateChanged(auth,async u=>{if(busy)return;CU=u;CP=null;if(u){try{CP=(await getDoc(doc(db,'clientes',u.uid))).data()||null}catch(e){}}
    if(S&&$('#wiz')){hdr();if(step!='L'&&step!='M')bk()}});
}else onAuthStateChanged(auth,u=>{U=u;if(busy)return;u?panel():landing()});
const hdr=()=>{const h=$('#hu');if(h)h.innerHTML=CU?'<a href="#agendamento" data-a=meus>Meus agendamentos</a><a href="#agendamento" data-a=csair>Sair</a>':'<a href="#agendamento" data-a=clogin>Entrar</a>'};

/* ============ LANDING / LOGIN / CADASTRO ============ */
function landing(mode='login'){
  theme();
  A.innerHTML=`<div class="top hero" style="background:${cover()}"><h1>Horário Salão</h1><p>Seu salão com agenda online. Cadastre-se e envie o link aos seus clientes.</p><a class=cta href="#acesso">Cadastrar meu salão</a></div>
  <div class=wrap><div class=card id=acesso><div class=tabs>
  <button class="${mode=='login'?'on':''}" data-a=lg>Entrar</button><button class="${mode=='cad'?'on':''}" data-a=cd>Cadastrar salão</button></div>
  ${mode=='cad'?`<label>Nome do salão</label><input id=nm placeholder="Ex.: Beleza & Estilo">
  <label>Endereço do link</label><input id=sg placeholder="beleza-estilo"><p class=mu id=pv></p>`:''}
  <label>E-mail</label><input id=em type=email><label>Senha</label><input id=pw type=password placeholder="mínimo 6 caracteres">
  <button class=btn data-a=${mode=='cad'?'signup':'login'}>${mode=='cad'?'Criar meu salão':'Entrar'}</button></div></div>`;
  if(mode=='cad'){const n=$('#nm'),s=$('#sg');n.oninput=()=>{if(!s.dataset.t)s.value=slugify(n.value);pv()};s.oninput=()=>{s.dataset.t=1;s.value=slugify(s.value);pv()};
    const pv=()=>$('#pv').textContent=s.value?location.origin+location.pathname+'?s='+s.value:''}
}
acts.lg=()=>landing('login');acts.cd=()=>landing('cad');
acts.login=async()=>{try{await signInWithEmailAndPassword(auth,v('em'),v('pw'))}catch(e){alert('E-mail ou senha inválidos.')}};
const mk=async(nome,sg)=>{
  const d={nome,slug:sg,cor:'#1f2a37',whats:'',end:'',abre:'09:00',fecha:'18:00',dias:[1,2,3,4,5,6],servicos:[],profissionais:[],promocoes:[]},w=writeBatch(db);
  w.set(doc(db,'slugs',sg),{uid:U.uid});w.set(doc(db,'saloes',U.uid),d);await w.commit();S=d;
};
acts.signup=async()=>{
  const nome=v('nm'),sg=slugify(v('sg'));if(!nome||!sg||!v('em')||v('pw').length<6)return alert('Preencha todos os campos (senha com 6+ caracteres).');
  busy=true;
  try{
    if((await getDoc(doc(db,'slugs',sg))).exists())throw{code:'slug',message:'Esse endereço já está em uso. Escolha outro.'};
    try{U=(await createUserWithEmailAndPassword(auth,v('em'),v('pw'))).user}
    catch(e){if(e.code=='auth/email-already-in-use')U=(await signInWithEmailAndPassword(auth,v('em'),v('pw'))).user;else throw e}
    await mk(nome,sg);
  }catch(e){busy=false;alert('Erro ao cadastrar: '+(e.code||'')+' — '+(e.message||''));if(U)panel();return}
  busy=false;panel();
};
acts.criar=async()=>{
  const nome=v('nm'),sg=slugify(v('sg')||nome);if(!nome||!sg)return alert('Informe o nome do salão.');
  try{if((await getDoc(doc(db,'slugs',sg))).exists())return alert('Esse endereço já está em uso. Escolha outro.');await mk(nome,sg);panel()}
  catch(e){alert('Erro: '+(e.code||'')+' — '+(e.message||''))}
};

/* ============ PAINEL DO SALÃO ============ */
const save=()=>setDoc(doc(db,'saloes',U.uid),S);
async function panel(){
  S=(await getDoc(doc(db,'saloes',U.uid))).data();
  if(!S){theme();if((await getDoc(doc(db,'clientes',U.uid))).exists()){A.innerHTML='<div class=wrap><div class=card><h2>Conta de cliente</h2><p class=mu>Esta conta é de cliente. Para agendar ou acompanhar seus horários, acesse pelo link do seu salão.</p><button class=btn data-a=sair>Sair</button></div></div>';return}A.innerHTML=`<div class=top><h1>Quase lá!</h1><p>Finalize o cadastro do seu salão</p></div><div class=wrap><div class=card><label>Nome do salão</label><input id=nm><label>Endereço do link</label><input id=sg placeholder="ex.: barbearia-martins"><button class=btn data-a=criar>Criar meu salão</button><button class="btn o" data-a=sair>Sair</button></div></div>`;return}
  theme(S.cor);draw();
}
const link=()=>location.origin+location.pathname+'?s='+S.slug;
const row=(l,i,t)=>`<div class=row><span>${t}</span><span><button class=x style="color:#555" data-a=ed data-l=${l} data-i=${i} title=Editar>✎</button><button class=x data-a=del data-l=${l} data-i=${i} title=Excluir>✕</button></span></div>`;
const sopts=sel=>S.servicos.map(s=>`<option value="${s.id}" ${sel==s.id?'selected':''}>${esc(s.nome)}</option>`).join('');
function cadPage(){
  let c='';const es=E('servicos'),ep=E('profissionais'),eo=E('promocoes'),bt=(e,a)=>`<button class="btn s" data-a=${a}>${e?'Salvar alterações':'Adicionar'}</button>${e?'<button class="btn s o" data-a=noed>Cancelar</button>':''}`;
  if(TAB=='serv')c=`<h2>Serviços e valores</h2>`+S.servicos.map((s,i)=>row('servicos',i,`<b>${esc(s.nome)}</b> · ${brl(s.preco)} · ${s.min}min${s.cat?' · '+esc(s.cat):''}`)).join('')+
   `<div class=add><input id=a1 placeholder="Nome do serviço" value="${esc(es?.nome)}"><input id=a2 type=number step=.01 placeholder="Valor (R$)" value="${es?.preco??''}"><input id=a3 type=number step=30 min=30 placeholder="Duração (min)" value="${es?.min||30}"><input id=a4 placeholder="Categoria (opcional)" value="${esc(es?.cat)}"><input id=a5 placeholder="Descrição (opcional)" value="${esc(es?.desc)}">${bt(es,'addserv')}</div>`;
  if(TAB=='prof')c=`<h2>Profissionais</h2>`+S.profissionais.map((p,i)=>row('profissionais',i,`${p.foto?`<img src="${p.foto}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px">`:''}<b>${esc(p.nome)}</b> · ${esc(p.funcao||'')}<br><span class=mu>${p.servs&&p.servs.length?p.servs.length+' serviço(s)':'todos os serviços'}</span>`)).join('')+
   `<div class=add><input id=a1 placeholder="Nome" value="${esc(ep?.nome)}"><input id=a2 placeholder="Função (ex.: Barbeiro)" value="${esc(ep?.funcao)}"><label>Foto (opcional)</label><input type=file accept="image/*" data-up=foto><img id=fp src="${ep?.foto||''}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;display:${ep?.foto?'block':'none'}"><label>Serviços que realiza <span class=mu>(nenhum marcado = todos)</span></label><div class=dias>${S.servicos.map(x=>`<label><input type=checkbox class=ps value="${x.id}" ${ep?.servs?.includes(x.id)?'checked':''}>${esc(x.nome)}</label>`).join('')||'<span class=mu>Cadastre serviços primeiro.</span>'}</div>${bt(ep,'addprof')}</div>`;
  if(TAB=='hor')c=`<h2>Horário de funcionamento</h2><label>Abre</label><input id=h1 type=time value="${S.abre}"><label>Fecha</label><input id=h2 type=time value="${S.fecha}"><label>Pausa de almoço <span class=mu>(opcional — sem atendimento neste intervalo)</span></label><div style="display:flex;gap:8px"><input id=h3 type=time value="${S.almI||''}"><input id=h4 type=time value="${S.almF||''}"></div>
   <label>Dias de atendimento</label><div class=dias>${DIAS.map((d,i)=>`<label><input type=checkbox class=dia value=${i} ${S.dias.includes(i)?'checked':''}>${d}</label>`).join('')}</div><button class=btn data-a=salhor>Salvar horários</button>`;

function dash(){

  dm=AGALL.filter(a=>a.data.startsWith(mes)),dmo=dm.filter(ok),fat=dmo.reduce((t,a)=>t+(a.valor||0),0),cl=clientes(),novos=cl.filter(c=>c.desde.startsWith(mes)).length,
  nx=[...Array(14)].map((_,i)=>({d:day(i),n:AGALL.filter(a=>a.data==day(i)&&ok(a)).length})),mx=Math.max(1,...nx.map(x=>x.n));
  const top=f=>{const c={};AGALL.filter(ok).forEach(a=>{const k=f(a);c[k]=c[k]||{n:0,v:0};c[k].n++;c[k].v+=a.valor||0});return Object.entries(c).sort((a,b)=>b[1].n-a[1].n).slice(0,5)};
  const hb=L=>{const m=Math.max(1,...L.map(x=>x[1].n));return L.map(x=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:.88rem"><span>${esc(x[0])}</span><span class=mu>${x[1].n} · ${brl(x[1].v)}</span></div><div style="background:#eee;border-radius:6px;height:8px"><div style="background:var(--c);height:8px;border-radius:6px;width:${x[1].n/m*100}%"></div></div></div>`).join('')||'<p class=mu>Sem dados ainda.</p>'};
  return `<div class=card style="margin-top:0"><p class=mu>Link do seu salão para os clientes:</p><input readonly value="${link()}" onclick="this.select()"><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><button class="btn s" data-a=copy>Copiar link</button><button class="btn s o" data-a=zap>Enviar por WhatsApp</button><a class="btn s o" style="text-decoration:none" href="${link()}" target=_blank>Ver página do cliente</a></div></div>
  <div class=kp>${[['Hoje',dH.length],['Próximos 7 dias',p7],['Faturamento do mês',brl(fat)],['Ticket médio',brl(dmo.length?fat/dmo.length:0)],['Clientes',cl.length],['Novos no mês',novos],['Faltas no mês',dm.length-dmo.length]].map(k=>`<div><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>
  <div class=g2><div class=card><h2>Agenda de hoje</h2>${dH.map(a=>`<div class=row style="cursor:pointer" data-a=agd data-id=${a.id}><span><b>${a.hora}</b> · ${esc(a.nome)}<br><span class=mu>${esc(a.servico)} com ${esc(a.profNome)}</span></span>${stag(a)}</div>`).join('')||'<p class=mu>Nenhum agendamento hoje.</p>'}<button class="btn s" style="margin-top:12px" data-a=novoday2>＋ Novo agendamento</button></div>
  <div class=card><h2>Próximos 14 dias</h2><div class=bars>${nx.map(x=>`<i style="height:${Math.max(3,x.n/mx*100)}%" title="${fd(x.d)}: ${x.n}"></i>`).join('')}</div><div class=bl>${nx.map(x=>`<span>${x.d.slice(8)}</span>`).join('')}</div></div>
  <div class=card><h2>Serviços mais vendidos</h2>${hb(top(a=>a.servico))}</div><div class=card><h2>Profissionais</h2>${hb(top(a=>a.profNome))}</div></div>`;
}

/* ---- Calendário + dia ---- */
function cal(){
  const {y,m}=CAL,start=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),hoje=iso(new Date()),cnt={};
  AGALL.forEach(a=>{if(a.status!='faltou')cnt[a.data]=(cnt[a.data]||0)+1});
  let cells=DIAS.map(d=>`<div class=h>${d}</div>`).join('')+'<div></div>'.repeat(start);
  for(let d=1;d<=dim;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="d ${ds==DAYSEL?'on':''} ${ds==hoje?'hj':''}" data-a=pday data-d=${ds}><b>${d}</b>${cnt[ds]?`<br><span class=badge>${cnt[ds]}</span>`:''}</div>`}
  return `<div class=card style="margin-top:0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="btn s o" data-a=cprev>‹</button><b>${MES[m]} ${y}</b><button class="btn s o" data-a=cnext>›</button></div><div class=cal>${cells}</div></div>
  <div class=card id=dayc><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0">${fd(DAYSEL)} · ${DIAS[new Date(DAYSEL+'T12:00').getDay()]}</h2><button class="btn s" data-a=novoday>＋ Agendar neste dia</button></div><p class=mu style="margin:6px 0 10px">Clique em um horário vazio (＋) para agendar, ou em um agendamento para ver os detalhes.</p><div style="overflow:auto">${dayGrid(DAYSEL)}</div></div>`;
}
function dayGrid(d){
  if(!S.dias.includes(new Date(d+'T12:00').getDay()))return '<p class=mu>O salão não atende neste dia (veja Configurações › Horários).</p>';
  const P=S.profissionais.length?S.profissionais:[{id:'',nome:'Geral'}],t0=tm(S.abre),rows=Math.max(1,Math.round((tm(S.fecha)-t0)/30)),ags=AGALL.filter(a=>a.data==d);
  let h=`<div class=tl style="grid-template-columns:52px repeat(${P.length},minmax(120px,1fr));grid-template-rows:auto repeat(${rows},38px)"><div></div>${P.map(p=>`<div style="text-align:center;font-weight:600;font-size:.85rem;padding-bottom:4px">${esc(p.nome)}</div>`).join('')}`;
  for(let r=0;r<rows;r++)h+=`<div class=t style="grid-row:${r+2};grid-column:1">${hm(t0+r*30)}</div>`;
  P.forEach((p,ci)=>{const cov={};
    ags.filter(a=>a.prof==p.id).forEach(a=>{const r0=Math.round((tm(a.hora)-t0)/30),n=Math.max(1,(a.blocos||[1]).length);if(r0<0||r0>=rows)return;
      h+=`<div class="ap ${{ag:'',concluido:'ok',faltou:'no',ps:'ps'}[stOf(a)]}" style="grid-row:${r0+2}/span ${n};grid-column:${ci+2}" data-a=agd data-id=${a.id}><b>${a.hora}</b> ${esc(a.nome)}<br>${esc(a.servico)}</div>`;for(let k=0;k<n;k++)cov[r0+k]=1});
    for(let r=0;r<rows;r++){if(cov[r])continue;const t=t0+r*30;h+=S.almI&&S.almF&&t>=tm(S.almI)&&t<tm(S.almF)?`<div class=lun style="grid-row:${r+2};grid-column:${ci+2}">almoço</div>`:`<button class=e style="grid-row:${r+2};grid-column:${ci+2}" data-a=slotnew data-p="${p.id}" data-h="${hm(t)}">＋</button>`}});
  return h+'</div>';
}

  <label>WhatsApp</label><input id=mt type=tel placeholder="(61) 99999-9999" value="${esc(pre.tel)}"><label>Profissional</label><select id=mp><option value="">Selecione</option>${S.profissionais.map(p=>`<option value="${p.id}" ${pre.prof==p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select>

/* ---- Clientes ---- */
function clientes(){
  const M={},hoje=iso(new Date());
  AGALL.forEach(a=>{const k=(a.tel||'').replace(/\D/g,'');if(!k)return;(M[k]=M[k]||{k,tel:a.tel,ag:[]}).ag.push(a)});
  return Object.values(M).map(m=>{
    m.ag.sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
    const ok=m.ag.filter(a=>a.status!='faltou'),ps=ok.filter(a=>a.data<=hoje);
    m.nome=m.ag[m.ag.length-1].nome;m.email=[...m.ag].reverse().map(a=>a.email).find(Boolean)||'';
    m.n=m.ag.length;m.faltas=m.n-ok.length;m.tot=ok.reduce((t,a)=>t+(a.valor||0),0);m.tk=ok.length?m.tot/ok.length:0;
    m.ult=ps.length?ps[ps.length-1].data:'';m.prox=m.ag.find(a=>a.data>=hoje&&!a.status);m.desde=m.ag[0].data;
    const ds=ps.map(a=>new Date(a.data+'T12:00').getTime()),g=[];for(let i=1;i<ds.length;i++)g.push((ds[i]-ds[i-1])/864e5);m.freq=g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length):0;
    const mode=f=>{const c={};ok.forEach(a=>c[f(a)]=(c[f(a)]||0)+1);const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:'—'};
    m.fs=mode(a=>a.servico);m.fp=mode(a=>a.profNome);m.dias=m.ult?Math.round((Date.now()-new Date(m.ult+'T12:00'))/864e5):0;
    m.tag=m.n==1?['Novo','n']:(m.ult&&m.dias>45&&!m.prox)?['Inativo','i']:ok.length>=5?['Fiel','f']:['Regular','r'];
    return m}).sort((a,b)=>(b.ult||b.desde).localeCompare(a.ult||a.desde));
}

  return `<div class=kp style="margin-bottom:14px">${[['Total de clientes',CL.length],['Novos no mês',CL.filter(c=>c.desde.startsWith(mes)).length],['Fiéis (5+ visitas)',CL.filter(c=>c.tag[1]=='f').length],['Inativos (45+ dias)',CL.filter(c=>c.tag[1]=='i').length]].map(k=>`<div><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>

function cliRows(){const q=QC.toLowerCase(),L=CL.filter(c=>!q||(c.nome+' '+c.tel).toLowerCase().includes(q));

/* ---- agendamento compartilhado (cliente e salão) ---- */
async function freeSlots(uid,prof,sv,d){
  if(!S.dias.includes(new Date(d+'T12:00').getDay()))return null;
  const q=await getDocs(query(collection(db,'ocupados'),where('uid','==',uid),where('data','==',d)));
  const busy=new Set(q.docs.map(x=>x.data().prof+'_'+x.data().hora)),n=sv.min/30,now=new Date(),hoje=d==iso(now),out=[];
  for(let t=tm(S.abre);t+n*30<=tm(S.fecha);t+=30){
    if(hoje&&t<=now.getHours()*60+now.getMinutes())continue;
    let ok=true;for(let k=0;k<n;k++){const b=t+k*30;if(busy.has(prof+'_'+hm(b))||(S.almI&&S.almF&&b>=tm(S.almI)&&b<tm(S.almF)))ok=false}
    if(ok)out.push(hm(t));
  }
  return out;
}
async function commitAg(uid,pf,sv,d,h0,nome,tel,cuid,valor,email,por){
  const w=writeBatch(db),blocos=[],n=sv.min/30;
  for(let k=0;k<n;k++){const h=hm(tm(h0)+k*30),id=`${uid}_${pf.id}_${d}_${h.replace(':','')}`;blocos.push(id);w.set(doc(db,'ocupados',id),{uid,prof:pf.id,data:d,hora:h,cuid})}
  w.set(doc(collection(db,'saloes',uid,'agendamentos')),{nome,tel,email:email||'',servico:sv.nome,servId:sv.id,prof:pf.id,profNome:pf.nome,data:d,hora:h0,valor:+(+valor).toFixed(2),blocos,cuid,por:por||'cliente',criado:Date.now()});
  await w.commit();
}

let B={},ouid='',step=1;
async function booking(sg){
  const sl=await getDoc(doc(db,'slugs',sg));
  if(!sl.exists()){A.innerHTML='<div class=wrap><div class=card><h2>Salão não encontrado</h2><p class=mu>Confira o link com o salão.</p></div></div>';return}
  ouid=sl.data().uid;S=(await getDoc(doc(db,'saloes',ouid))).data();theme(S.cor);document.title=S.nome+' | Agendamento';B={};step=1;
  const cards=S.servicos.map(x=>{const p=price(x,S.promocoes);return`<div class=card><h3>${esc(x.nome)}</h3>${x.desc?`<p class=mu>${esc(x.desc)}</p>`:''}<div class=pr>${p.pct?`<span class=old>${brl(x.preco)}</span>`:''}${brl(p.final)} · ${x.min}min</div></div>`}).join('')||'<p class=mu style="text-align:center">Em breve.</p>';
  A.innerHTML=`<div class=hd>${S.logo?`<img src="${S.logo}" alt="${esc(S.nome)}">`:`<b>${esc(S.nome)}</b>`}<nav><a href="#servicos">Serviços</a><a href="#agendamento">Agendar</a><span id=hu></span></nav></div>
  <div class=hero style="background:${cover(S.capa)}"><h1>${esc(S.titulo||S.nome)}</h1><p>${esc(S.sub||'Agende seu horário em poucos cliques.')}</p><a class=cta href="#agendamento">Agendar agora</a></div>
  ${S.promocoes.length?`<div class=sec>${S.promocoes.map(p=>`<div class=promo>🎉 <b>${esc(p.titulo)}</b> — ${p.pct}% de desconto</div>`).join('')}</div>`:''}
  <div class=sec id=servicos><h2 style="text-align:center;margin:30px 0 16px">Nossos serviços</h2><div class=sv>${cards}</div></div>
  <div class=wrap id=agendamento><h2 style="text-align:center;margin:30px 0 0">Faça seu agendamento</h2><div class=card id=wiz></div></div>
  <footer>© ${new Date().getFullYear()} ${esc(S.nome)}${S.end?' · '+esc(S.end):''}</footer>`;
  hdr();bk();
}
const bsv=()=>S.servicos.find(s=>s.id==B.serv),bpf=()=>S.profissionais.find(p=>p.id==B.prof);
function bk(){
  const bar=`<div class=steps>${[1,2,3].map(i=>`<i class="${step>=i?'on':''}"></i>`).join('')}</div>`;
  let c='';
  if(step=='L'){
    const cad=CM=='cad';
    c=`<h2>${cad?'Criar conta':'Entrar'}</h2><p class=mu>Com uma conta você acompanha e cancela seus agendamentos.</p>${cad?'<label>Nome completo</label><input id=ln autocomplete=name><label>WhatsApp</label><input id=lt type=tel placeholder="(61) 99999-9999">':''}<label>E-mail</label><input id=le type=email autocomplete=email><label>Senha</label><input id=lp type=password placeholder="mínimo 6 caracteres"><button class=btn data-a=cgo>${cad?'Criar conta':'Entrar'}</button><button class="btn o" data-a=ctog>${cad?'Já tenho conta':'Criar conta'}</button><button class="btn o" data-a=home>Voltar</button>`;
  }
  if(step=='M')c=`<h2>Meus agendamentos</h2><div id=ml><p class=mu>Carregando…</p></div><button class="btn o" data-a=novo>Novo agendamento</button>`;
  if(step==1){
    const sel=bpf(),L=S.servicos.filter(x=>!sel||!(sel.servs&&sel.servs.length)||sel.servs.includes(x.id)),cats=[...new Set(L.map(x=>x.cat||'Serviços'))];
    c=`${bar}<h2>Escolha o profissional</h2><div class=pfs>${S.profissionais.map(p=>`<button data-a=pickprof data-p=${p.id} class="${B.prof==p.id?'on':''}">${av(p)}<b>${esc(p.nome)}</b><br><span class=mu>${esc(p.funcao||'')}</span></button>`).join('')||'<p class=mu>Nenhum profissional cadastrado.</p>'}</div>
    <label>Serviço</label><select id=ss ${sel?'':'disabled'}><option value="">${sel?'Selecione':'Escolha o profissional primeiro'}</option>${cats.map(k=>`<optgroup label="${esc(k)}">${L.filter(x=>(x.cat||'Serviços')==k).map(x=>{const p=price(x,S.promocoes);return`<option value="${x.id}" ${B.serv==x.id?'selected':''}>${esc(x.nome)} — ${brl(p.final)} (${x.min}min)</option>`}).join('')}</optgroup>`).join('')}</select>
    <button class=btn data-a=n1>Continuar</button>`;
  }
  if(step==2){
    c=`${bar}<h2>Data e horário</h2><label>Data</label><input id=dt type=date min="${iso(new Date())}" value="${B.data||''}"><div class=slots id=sl><p class=mu style="grid-column:1/-1">Escolha uma data.</p></div>
    <button class=btn data-a=n2 id=nx disabled>Continuar</button><button class="btn o" data-a=back>Voltar</button>`;
  }
  if(step==3){
    const s=bsv(),p=price(s,S.promocoes);
    c=`${bar}<h2>Seus dados</h2><p class=mu>${esc(s.nome)} com ${esc(bpf().nome)}<br>${B.data.split('-').reverse().join('/')} às ${B.hora} · ${p.pct?`<span class=old>${brl(s.preco)}</span>`:''}<b>${brl(p.final)}</b> (pagamento no local)</p>
    ${CU?`<p class=mu>Agendando como ${esc(CU.email)}</p>`:'<p class=mu>Já tem conta? <a href="#agendamento" data-a=clogin>Entre</a> para acompanhar seus agendamentos.</p>'}<label>Nome completo</label><input id=cn autocomplete=name value="${esc(CP?.nome)}"><label>WhatsApp</label><input id=ct type=tel placeholder="(61) 99999-9999" autocomplete=tel value="${esc(CP?.tel)}">
    <button class=btn data-a=conf id=cf>Confirmar agendamento</button><button class="btn o" data-a=back>Voltar</button>`;
  }
  if(step==4){
    c=`<div class=ok><div class=big>✅</div><h2>Agendamento confirmado!</h2><p>${esc(bsv().nome)} com ${esc(bpf().nome)}<br><b>${B.data.split('-').reverse().join('/')} às ${B.hora}</b></p>
    ${S.whats?`<a class=btn style="display:block;text-decoration:none" target=_blank href="${wa(S.whats,'Olá! Agendei '+bsv().nome+' em '+B.data.split('-').reverse().join('/')+' às '+B.hora+' (nome: '+B.nome+').')}">Avisar no WhatsApp do salão</a>`:''}${CU?'<button class="btn o" data-a=meus>Ver meus agendamentos</button>':'<p class=mu style="margin-top:14px">Crie uma conta para acompanhar seus agendamentos: <a href="#agendamento" data-a=clogin>Entrar / Criar conta</a></p>'}<button class="btn o" data-a=novo>Novo agendamento</button></div>`;
  }
  $('#wiz').innerHTML=c;if(step!=1)$('#wiz').scrollIntoView();if(step=='M')loadMeus();
  if(step==2){$('#dt').onchange=loadSlots;if(B.data)loadSlots()}
}
acts.back=()=>{step--;bk()};
acts.clogin=()=>{CM='login';step='L';bk()};
acts.ctog=()=>{CM=CM=='cad'?'login':'cad';bk()};
acts.meus=()=>{step='M';bk()};
acts.home=()=>{step=(B.hora&&B.serv&&!B.done)?3:1;bk()};
acts.novo=()=>{B={};step=1;bk()};
acts.csair=async()=>{await signOut(auth);CU=CP=null;hdr();if(step=='M')step=1;bk()};
acts.cgo=async()=>{
  const em=v('le'),pw=v('lp');if(!em||pw.length<6)return alert('Informe e-mail e senha (mínimo 6 caracteres).');
  busy=true;
  try{
    if(CM=='cad'){const nome=v('ln'),tel=v('lt');if(nome.length<3||tel.replace(/\D/g,'').length<10)throw{message:'Informe nome e WhatsApp com DDD.'};
      CU=(await createUserWithEmailAndPassword(auth,em,pw)).user;CP={nome,tel,email:em};await setDoc(doc(db,'clientes',CU.uid),CP)}
    else{CU=(await signInWithEmailAndPassword(auth,em,pw)).user;CP=null;try{CP=(await getDoc(doc(db,'clientes',CU.uid))).data()||null}catch(e){}}
  }catch(e){busy=false;alert(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(e.code)?'E-mail ou senha inválidos.':e.code=='auth/email-already-in-use'?'Este e-mail já tem conta. Use Entrar.':(e.message||'Erro ao entrar.'));return}
  busy=false;hdr();step=(B.hora&&B.serv&&!B.done)?3:1;bk();
};
async function loadMeus(){
  try{
    const q=await getDocs(query(collection(db,'saloes',ouid,'agendamentos'),where('cuid','==',CU.uid)));
    MY=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
    const hoje=iso(new Date());
    $('#ml').innerHTML=MY.length?MY.map((a,i)=>{const f=a.data>=hoje;return`<div class=row><span><b>${a.data.split('-').reverse().join('/')} ${a.hora}</b> · ${esc(a.servico)} com ${esc(a.profNome)}<br><span class=mu>${brl(a.valor)} · ${a.status=='concluido'?'Concluído':a.status=='faltou'?'Faltou':f?'Agendado':'Realizado'}</span></span>${f?`<button class=x data-a=ccancel data-i=${i} title="Cancelar">✕</button>`:''}</div>`}).join(''):'<p class=mu>Você ainda não tem agendamentos neste salão.</p>';
  }catch(e){$('#ml').innerHTML='<p class=mu>Não foi possível carregar seus agendamentos.</p>'}
}
acts.ccancel=async b=>{const a=MY[+b.dataset.i];if(!confirm('Cancelar este agendamento?'))return;const w=writeBatch(db);(a.blocos||[]).forEach(id=>w.delete(doc(db,'ocupados',id)));w.delete(doc(db,'saloes',ouid,'agendamentos',a.id));try{await w.commit();toast('Agendamento cancelado');loadMeus()}catch(e){alert('Não foi possível cancelar.')}};
acts.pickprof=b=>{const x=$('#ss');if(x)B.serv=x.value;B.prof=b.dataset.p;const pf=bpf();if(pf.servs&&pf.servs.length&&!pf.servs.includes(B.serv))B.serv='';bk()};
acts.n1=()=>{B.serv=$('#ss').value;if(!B.prof||!B.serv)return alert('Escolha o profissional e o serviço.');step=2;bk()};
acts.n2=()=>{step=3;bk()};
async function loadSlots(){
  B.data=v('dt');B.hora='';$('#nx').disabled=true;const box=$('#sl');
  box.innerHTML='<p class=mu style="grid-column:1/-1">Carregando…</p>';
  const out=await freeSlots(ouid,B.prof,bsv(),B.data);
  box.innerHTML=out==null?'<p class=mu style="grid-column:1/-1">O salão não atende neste dia.</p>':out.length?out.map(h=>`<button data-a=pick data-h=${h}>${h}</button>`).join(''):'<p class=mu style="grid-column:1/-1">Sem horários livres nesta data.</p>';
}
acts.pick=b=>{B.hora=b.dataset.h;document.querySelectorAll('.slots button').forEach(x=>x.classList.toggle('on',x==b));$('#nx').disabled=false};
acts.conf=async()=>{
  const nome=v('cn'),tel=v('ct');if(nome.length<3||tel.replace(/\D/g,'').length<10)return alert('Informe seu nome e WhatsApp com DDD.');
  $('#cf').disabled=true;const sv=bsv(),p=price(sv,S.promocoes);
  try{await commitAg(ouid,bpf(),sv,B.data,B.hora,nome,tel,CU?CU.uid:'',p.final,CU?CU.email:'','cliente');B.nome=nome;B.done=true;step=4;bk()}
  catch(e){alert('Esse horário acabou de ser ocupado. Escolha outro.');step=2;bk()}
};
